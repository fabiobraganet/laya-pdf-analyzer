services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - laya-pdf-analyzer-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  laya-pdf-analyzer-data:
