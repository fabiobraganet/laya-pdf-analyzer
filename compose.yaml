services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LAYA_URL: http://laya:8000
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - laya-pdf-analyzer-data:/data
    networks:
      - default
      - laya-runtime
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  laya-pdf-analyzer-data:
networks:
  laya-runtime:
    external: true
    name: laya-dataset-manager_default
